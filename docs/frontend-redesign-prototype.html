<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YOLO 面板 · Mono 设计系统原型</title>
<style>
/* ============ Token ============ */
:root {
  --font-ui: "Segoe UI Variable Text", -apple-system, "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", sans-serif;
  --font-mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
  --y-r-sm: 6px; --y-r-md: 8px;
  --y-e1: 0 4px 12px rgba(0,0,0,.08);
  --y-dur-1: 100ms; --y-dur-2: 150ms; --y-dur-3: 200ms;
  --ease-out: cubic-bezier(.2,0,0,1);
  --ease-in: cubic-bezier(.4,0,1,1);
}
:root[data-theme="dark"] {
  --y-bg: #0A0A0B; --y-surface: #111113; --y-surface-2: #17171A; --y-surface-3: #1E1E22;
  --y-line: #1F1F23; --y-line-strong: #2A2A30;
  --y-text-1: #F4F4F5; --y-text-2: #A1A1A8; --y-text-3: #909098;
  --y-accent-text: #9E9CF5; --y-accent-fill: #5B5BD6; --y-accent-soft: rgba(110,107,232,.16);
  --y-danger-text: #F0716B; --y-ok-text: #52C58F; --y-scrim: rgba(0,0,0,.44);
  --y-e1: 0 4px 12px rgba(0,0,0,.40);
}
:root[data-theme="light"] {
  --y-bg: #FFFFFF; --y-surface: #FFFFFF; --y-surface-2: #F4F4F5; --y-surface-3: #EBEBEF;
  --y-line: #E9E9EC; --y-line-strong: #D6D6DB;
  --y-text-1: #18181B; --y-text-2: #52525B; --y-text-3: #71717A;
  --y-accent-text: #4F46E5; --y-accent-fill: #5B5BD6; --y-accent-soft: rgba(91,91,214,.10);
  --y-danger-text: #BE3A31; --y-ok-text: #1F7A53; --y-scrim: rgba(0,0,0,.20);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { font-family: var(--font-ui); font-size: 13px; color: var(--y-text-1); background: var(--y-surface-3); }
button { font-family: inherit; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
::selection { background: var(--y-accent-soft); }
:focus-visible { outline: 2px solid var(--y-accent-text); outline-offset: 2px; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--y-surface-3); border-radius: 5px; border: 2px solid var(--y-bg); }
::-webkit-scrollbar-track { background: transparent; }
svg.ic { display: block; }

/* ============ IDE 背景模拟 ============ */
.ide { position: fixed; inset: 0; display: flex; background: var(--y-surface-3); }
.ide-rail { width: 48px; border-right: 1px solid var(--y-line); display: flex; flex-direction: column; align-items: center; padding-top: 14px; gap: 14px; }
.ide-dot { width: 18px; height: 18px; border-radius: 5px; background: var(--y-surface-2); }
.ide-code { flex: 1; padding: 24px 28px; display: flex; flex-direction: column; gap: 10px; }
.ide-line { height: 10px; border-radius: 3px; background: var(--y-surface-2); }

/* ============ 面板骨架 ============ */
.stage { position: fixed; inset: 0; display: flex; justify-content: center; }
.stage.closed .panel { display: none; }
.panel { position: relative; width: min(100%, var(--pw, 100%)); height: 100%; display: flex; flex-direction: column; background: var(--y-bg); box-shadow: 0 0 0 1px var(--y-line); animation: panel-in var(--y-dur-3) var(--ease-out); }
@keyframes panel-in { from { opacity: 0; transform: translateY(4px); } }

/* 头部 */
.p-head { flex: none; height: 48px; display: flex; align-items: center; gap: 14px; padding: 0 10px 0 16px; border-bottom: 1px solid var(--y-line); }
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
.logo { color: var(--y-text-1); display: grid; place-items: center; }
.brand-name { font-size: 14px; font-weight: 700; letter-spacing: .02em; }
.p-date { font-size: 11px; color: var(--y-text-3); }
.p-head-acts { margin-left: auto; display: flex; gap: 2px; align-items: center; }
.hbtn { width: 30px; height: 30px; border-radius: var(--y-r-sm); border: none; background: none; color: var(--y-text-3); display: grid; place-items: center; cursor: pointer; transition: background var(--y-dur-1), color var(--y-dur-1); }
.hbtn:hover { background: var(--y-surface-2); color: var(--y-text-1); }
.hbtn.spin svg { animation: spin .6s linear; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 工具条 */
.p-toolbar { flex: none; position: relative; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 16px; border-bottom: 1px solid var(--y-line); }
.seg { display: flex; height: 100%; }
.seg-btn { position: relative; height: 100%; padding: 0 9px; font-size: 13px; color: var(--y-text-2); background: none; border: none; cursor: pointer; transition: color var(--y-dur-1); }
.seg-btn:hover { color: var(--y-text-1); }
.seg-btn.on { color: var(--y-text-1); font-weight: 700; }
.seg-btn.on::after { content: ""; position: absolute; left: 9px; right: 9px; bottom: 0; height: 2px; background: var(--y-accent-fill); border-radius: 1px 1px 0 0; }
.tb-spacer { flex: 1; }
.caps { display: flex; gap: 6px; }
.cap { display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border: 1px solid var(--y-line-strong); border-radius: var(--y-r-sm); background: none; color: var(--y-text-2); font-size: 11px; cursor: pointer; transition: all var(--y-dur-1); }
.cap:hover { color: var(--y-text-1); border-color: var(--y-text-3); }
.cap.on { background: var(--y-accent-soft); color: var(--y-accent-text); border-color: transparent; }
.cap .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 11px; display: inline-block; }
.cap .num.tick { animation: num-tick var(--y-dur-2) var(--ease-out); }
@keyframes num-tick { from { transform: translateY(6px); opacity: 0; } }
.flt-wrap { position: relative; }
.flt { display: flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border: none; border-radius: var(--y-r-sm); background: none; color: var(--y-text-2); font-size: 11px; cursor: pointer; transition: background var(--y-dur-1), color var(--y-dur-1); }
.flt:hover { background: var(--y-surface-2); color: var(--y-text-1); }
.flt .chev { display: grid; place-items: center; }
.flt-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--y-accent-fill); opacity: 0; transition: opacity var(--y-dur-1); }
.flt.has-filters .flt-dot { opacity: 1; }
.sweep { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: linear-gradient(90deg, transparent, var(--y-accent-fill) 30%, var(--y-accent-fill) 70%, transparent); transform: scaleX(0); transform-origin: left; pointer-events: none; }
.sweep.run { animation: sweep var(--y-dur-3) linear; }
@keyframes sweep { 0% { transform: scaleX(0); opacity: 1; } 70% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }

/* 筛选菜单 */
.menu { position: absolute; top: 32px; right: 0; width: 216px; background: var(--y-surface); border: 1px solid var(--y-line-strong); border-radius: var(--y-r-md); box-shadow: var(--y-e1); padding: 6px; opacity: 0; transform: translateY(4px); pointer-events: none; transition: opacity var(--y-dur-2) var(--ease-out), transform var(--y-dur-2) var(--ease-out); z-index: 40; }
.menu.open { opacity: 1; transform: none; pointer-events: auto; }
.menu-g { padding: 7px 8px 3px; font-size: 10px; color: var(--y-text-3); letter-spacing: .04em; }
.mrow { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border-radius: var(--y-r-sm); font-size: 12px; color: var(--y-text-2); cursor: pointer; }
.mrow:hover { background: var(--y-surface-2); color: var(--y-text-1); }
.ck { width: 14px; height: 14px; flex: none; border: 1px solid var(--y-line-strong); border-radius: 4px; display: grid; place-items: center; color: transparent; transition: all var(--y-dur-1); }
.ck.on { background: var(--y-accent-fill); border-color: var(--y-accent-fill); color: #fff; }
.ck svg { width: 10px; height: 10px; }
.mrow--static { color: var(--y-text-3); cursor: default; }
.mrow--static:hover { background: none; color: var(--y-text-3); }
.minput { width: 100%; height: 28px; margin: 2px 0 4px; padding: 0 8px; border: 1px solid var(--y-line-strong); border-radius: var(--y-r-sm); background: var(--y-surface-2); color: var(--y-text-1); font: inherit; font-size: 12px; outline: none; }
.minput:focus { border-color: var(--y-accent-text); }

/* ============ 主体 ============ */
.p-body { flex: 1; min-height: 0; overflow-y: auto; transition: padding var(--y-dur-3) var(--ease-out); }
.panel.docked:not(.compact) .p-body { padding-right: 356px; }
.p-main { max-width: 720px; margin: 0 auto; padding: 4px 0 24px; }
.p-main--chat { padding: 16px 0; }

/* 通知块 */
.notif-wrap { display: grid; grid-template-rows: 1fr; transition: grid-template-rows var(--y-dur-2) var(--ease-in), opacity var(--y-dur-2) var(--ease-in), margin var(--y-dur-2); margin-bottom: 8px; }
.notif-wrap.closed { grid-template-rows: 0fr; opacity: 0; margin-bottom: 0; }
.notif { position: relative; min-height: 0; overflow: hidden; background: var(--y-surface); border: 1px solid var(--y-line-strong); border-radius: var(--y-r-md); box-shadow: var(--y-e1); padding: 10px 12px 10px 15px; animation: row-in var(--y-dur-2) var(--ease-out); }
.notif::before { content: ""; position: absolute; left: -1px; top: 9px; bottom: 9px; width: 2px; border-radius: 2px; background: var(--y-accent-fill); }
.notif.reminder::before { background: var(--y-danger-text); }
.notif-head { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; color: var(--y-text-2); }
.notif-head svg { color: var(--y-text-3); }
.notif-type { font-size: 12px; font-weight: 600; color: var(--y-text-1); }
.notif-time { font-size: 11px; color: var(--y-text-3); margin-left: auto; }
.notif-body { font-size: 13px; line-height: 19px; color: var(--y-text-1); margin-bottom: 9px; }
.notif-acts { display: flex; gap: 6px; }

/* 按钮 */
.btn { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 12px; border-radius: var(--y-r-sm); border: 1px solid transparent; font-size: 12px; cursor: pointer; transition: all var(--y-dur-1); }
.btn:active { transform: scale(.98); }
.btn-pri { background: var(--y-accent-fill); color: #fff; }
.btn-pri:hover { filter: brightness(1.08); }
.btn-ghost { background: none; color: var(--y-text-2); }
.btn-ghost:hover { background: var(--y-surface-2); color: var(--y-text-1); }
.btn-danger { background: none; color: var(--y-danger-text); border-color: color-mix(in srgb, var(--y-danger-text) 40%, transparent); }
.btn-danger:hover { background: color-mix(in srgb, var(--y-danger-text) 10%, transparent); }
.nact { height: 24px; padding: 0 10px; border: none; border-radius: var(--y-r-sm); background: none; color: var(--y-text-2); font-size: 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; transition: all var(--y-dur-1); }
.nact:hover { background: var(--y-surface-2); color: var(--y-text-1); }
.nact--chat { color: var(--y-accent-text); border: 1px solid color-mix(in srgb, var(--y-accent-text) 45%, transparent); }
.nact--chat:hover { background: var(--y-accent-soft); }
.nact svg { width: 12px; height: 12px; }

/* 分区与任务行 */
.sec { margin-top: 20px; animation: crossfade var(--y-dur-2) var(--ease-out); }
@keyframes crossfade { from { opacity: .4; } }
.sec-head { display: flex; align-items: center; gap: 8px; height: 32px; }
.sec-name { font-size: 13px; font-weight: 700; color: var(--y-text-1); letter-spacing: .02em; }
.sec-count { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 11px; font-weight: 600; color: var(--y-text-2); }
.sec-count.danger { color: var(--y-danger-text); }
.sec-rule { flex: 1; height: 1px; background: var(--y-line); }
.row-wrap { display: grid; grid-template-rows: 1fr; transition: grid-template-rows var(--y-dur-2) var(--ease-in), opacity var(--y-dur-2) var(--ease-in); }
.row-wrap.closed { grid-template-rows: 0fr; opacity: 0; }
.row { position: relative; display: flex; gap: 10px; padding: 10px 16px; margin: 0 -16px; border-bottom: 1px solid var(--y-line); min-height: 0; transition: background var(--y-dur-1), opacity var(--y-dur-2); cursor: default; }
.row:hover, .row:focus-visible { background: var(--y-surface-2); }
.row.new { animation: row-in var(--y-dur-3) var(--ease-out); }
@keyframes row-in { from { opacity: 0; transform: translateY(4px); } }
.row.retire { opacity: .45; }
.row.done-row { opacity: .55; }
.ctl { flex: none; width: 16px; height: 16px; margin-top: 2px; border-radius: 50%; border: 1.5px solid var(--y-line-strong); background: transparent; color: transparent; cursor: pointer; display: grid; place-items: center; padding: 0; transition: border-color var(--y-dur-2), background var(--y-dur-2); }
.row:hover .ctl { border-color: var(--y-text-3); }
.ctl:hover { border-color: var(--y-accent-fill) !important; }
.row.overdue .ctl { border-color: var(--y-danger-text); }
.row.inprog .ctl { border-color: var(--y-accent-fill); background: linear-gradient(to top, var(--y-accent-fill) 50%, transparent 50%); }
.ctl.done { background: var(--y-ok-text); border-color: var(--y-ok-text); color: #fff; }
.row-main { flex: 1; min-width: 0; }
.row-title { display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 18px; color: var(--y-text-1); }
.row-title svg { flex: none; color: var(--y-text-3); }
.row-title svg.urgent { color: var(--y-danger-text); }
.row-title .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.inprog-tag { flex: none; font-size: 10px; font-weight: 600; color: var(--y-accent-text); background: var(--y-accent-soft); padding: 1px 6px; border-radius: 4px; }
.row-meta { display: flex; align-items: center; gap: 6px; margin-top: 2px; font-size: 11px; line-height: 16px; color: var(--y-text-2); white-space: nowrap; overflow: hidden; }
.due { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--y-text-2); }
.row.overdue .due { color: var(--y-danger-text); }
.sep { color: var(--y-line-strong); }
.ms-chip { display: inline-flex; align-items: center; gap: 3px; cursor: pointer; }
.ms-chip:hover { color: var(--y-text-2); }
.ms-chip svg { width: 10px; height: 10px; }
.src { display: inline-flex; align-items: center; gap: 4px; margin-left: auto; min-width: 0; }
.src svg { flex: none; width: 11px; height: 11px; opacity: .7; }
.src span { overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
.row-acts { flex: none; display: flex; gap: 2px; opacity: 0; transition: opacity var(--y-dur-1); }
.row:hover .row-acts, .row:focus-visible .row-acts, .row.editing .row-acts { opacity: 1; }
.act { width: 24px; height: 24px; border: none; border-radius: var(--y-r-sm); background: none; color: var(--y-text-3); display: grid; place-items: center; cursor: pointer; transition: background var(--y-dur-1), color var(--y-dur-1); }
.act:hover { background: var(--y-surface-3); color: var(--y-text-1); }
.act svg { width: 14px; height: 14px; }

/* 行内编辑 */
.edit-form { flex: 1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ef-input { height: 28px; padding: 0 8px; border: 1px solid var(--y-line-strong); border-radius: var(--y-r-sm); background: var(--y-surface); color: var(--y-text-1); font: inherit; font-size: 12px; outline: none; }
.ef-input:focus { border-color: var(--y-accent-text); }
.ef-title { flex: 1; min-width: 160px; }
.ef-date { width: 110px; font-family: var(--font-mono); }
.ef-sel { height: 28px; padding: 0 6px; border: 1px solid var(--y-line-strong); border-radius: var(--y-r-sm); background: var(--y-surface); color: var(--y-text-2); font: inherit; font-size: 11px; outline: none; cursor: pointer; }
.ef-btn { height: 24px; padding: 0 10px; font-size: 11px; }
.confirm-strip { flex-basis: 100%; display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid color-mix(in srgb, var(--y-danger-text) 40%, transparent); border-radius: var(--y-r-sm); font-size: 11px; color: var(--y-danger-text); animation: row-in var(--y-dur-2) var(--ease-out); }

/* 折叠区 */
.fold { margin-top: 18px; border-top: 1px solid var(--y-line-strong); }
.fold-head { display: flex; align-items: center; gap: 8px; height: 36px; cursor: pointer; color: var(--y-text-1); font-size: 13px; font-weight: 700; user-select: none; padding: 0 6px; margin: 0 -6px; border-radius: var(--y-r-sm); transition: background var(--y-dur-1), color var(--y-dur-1); }
.fold-head:hover { color: var(--y-text-1); background: var(--y-surface-2); }
.fold-head svg { width: 12px; height: 12px; transition: transform var(--y-dur-2) var(--ease-out); color: var(--y-text-2); }
.fold.open .fold-head svg { transform: rotate(90deg); }
.fold-stat { margin-left: auto; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 11px; color: var(--y-text-2); }
.fold-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--y-dur-2) var(--ease-out); }
.fold.open .fold-body { grid-template-rows: 1fr; }
.fold-inner { min-height: 0; overflow: hidden; }
.fold-pad { min-width: 0; }

/* 目标 · 刻度进度条 */
.goal { padding: 10px 0 6px; border-bottom: 1px solid var(--y-line); }
.goal:last-child { border-bottom: none; }
.goal.flash { animation: crossfade var(--y-dur-2) var(--ease-out); }
.goal-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.goal-name { font-size: 13px; font-weight: 600; cursor: text; }
.goal-name:hover { text-decoration: underline dotted var(--y-text-3); }
.goal-name-input { height: 26px; padding: 0 8px; border: 1px solid var(--y-accent-text); border-radius: var(--y-r-sm); background: var(--y-surface); color: var(--y-text-1); font: inherit; font-size: 13px; font-weight: 600; outline: none; width: 60%; }
.goal-pct { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 600; color: var(--y-accent-text); }
.goal-track { position: relative; height: 4px; margin: 0 8px 46px; border-radius: 2px; background: var(--y-line-strong); }
.goal-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--y-accent-fill); transition: width var(--y-dur-3) var(--ease-out); }
.ms-dot { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 9px; height: 9px; border-radius: 50%; background: var(--y-bg); border: 1.5px solid var(--y-line-strong); cursor: pointer; padding: 0; transition: transform var(--y-dur-1); }
.ms-dot:hover { transform: translate(-50%, -50%) scale(1.25); }
.ms-dot.done { background: var(--y-ok-text); border-color: var(--y-ok-text); }
.ms-dot.active { background: var(--y-accent-fill); border-color: var(--y-accent-fill); }
.ms-dot.hl { box-shadow: 0 0 0 3px var(--y-accent-soft); }
.ms-label { position: absolute; left: 0; transform: translateX(-50%); text-align: center; font-size: 10px; line-height: 13px; color: var(--y-text-3); white-space: nowrap; }
.ms-dot:nth-child(odd) .ms-label { top: 11px; }
.ms-dot:nth-child(even) .ms-label { top: 26px; }
.ms-label b { display: block; font-weight: 500; color: var(--y-text-2); }
.ms-label i { font-style: normal; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.ms-pop { position: absolute; bottom: 16px; left: var(--x, 50%); transform: translateX(-50%); width: 168px; background: var(--y-surface); border: 1px solid var(--y-line-strong); border-radius: var(--y-r-md); box-shadow: var(--y-e1); padding: 8px; z-index: 10; animation: row-in var(--y-dur-2) var(--ease-out); }
.ms-pop input { width: 100%; height: 26px; padding: 0 8px; margin-bottom: 6px; border: 1px solid var(--y-line-strong); border-radius: var(--y-r-sm); background: var(--y-surface-2); color: var(--y-text-1); font: inherit; font-size: 11px; outline: none; }
.ms-pop input:focus { border-color: var(--y-accent-text); }
.ms-pop-row { display: flex; gap: 4px; }
.ms-st { flex: 1; height: 22px; border: none; border-radius: 4px; background: var(--y-surface-2); color: var(--y-text-2); font-size: 10px; cursor: pointer; }
.ms-st:hover { background: var(--y-surface-3); color: var(--y-text-1); }
.ms-st.on { background: var(--y-accent-soft); color: var(--y-accent-text); }

/* 台账 */
.lg-row { display: flex; align-items: center; gap: 8px; height: 28px; border-bottom: 1px solid var(--y-line); font-size: 12px; }
.lg-row:last-child { border-bottom: none; }
.lg-row .ic-ok { width: 12px; height: 12px; color: var(--y-ok-text); flex: none; }
.lg-time { width: 40px; flex: none; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 11px; color: var(--y-text-3); }
.lg-type { width: 36px; flex: none; font-size: 11px; color: var(--y-text-2); }

.lg-src { flex: none; display: flex; align-items: center; gap: 4px; max-width: 150px; font-size: 11px; color: var(--y-text-3); }
.lg-src svg { width: 10px; height: 10px; flex: none; opacity: .7; }

/* 空态 / 骨架 */
.empty { padding: 40px 16px; text-align: center; }

.empty p { margin: 0; font-size: 12px; color: var(--y-text-3); }
.skel-notif, .skel-row { background: var(--y-surface-2); border-radius: var(--y-r-sm); }
.skel-notif { height: 88px; margin: 14px 16px 8px; }
.skel-row { height: 40px; margin: 8px 16px; }

.skel-notif, .skel-row, .skel-head { background-image: linear-gradient(100deg, transparent 40%, var(--y-surface-3) 50%, transparent 60%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }

/* 捕获条 */
.capture { flex: none; height: 52px; display: flex; align-items: center; padding: 0 16px; background: var(--y-bg); border-top: 1px solid var(--y-line); }

.enter-hint { margin-left: 10px; font-size: 11px; color: var(--y-text-3); transition: color var(--y-dur-1); }

/* 消息 */
.msgs { display: flex; flex-direction: column; gap: 14px; padding: 4px 16px 16px; }
.msg { max-width: 78%; font-size: 13px; line-height: 19px; animation: row-in var(--y-dur-2) var(--ease-out); }
.msg.ai { align-self: flex-start; color: var(--y-text-1); }
.msg.me { align-self: flex-end; background: var(--y-surface-2); border-radius: var(--y-r-md); padding: 8px 11px; }
.msg .who { font-size: 10px; color: var(--y-text-3); margin-bottom: 3px; }

/* 侧栏对话 dock */
.dock { position: fixed; top: 0; right: 0; bottom: 0; width: 340px; max-width: 100%; background: var(--y-surface); border-left: 1px solid var(--y-line); display: flex; flex-direction: column; transform: translateX(24px); opacity: 0; pointer-events: none; transition: transform var(--y-dur-3) var(--ease-out), opacity var(--y-dur-3) var(--ease-out); z-index: 30; }

.dock-head { flex: none; height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 14px; border-bottom: 1px solid var(--y-line); }
.dock-tag { font-size: 12px; font-weight: 600; color: var(--y-text-1); }
.dock-ctx { font-size: 11px; color: var(--y-accent-text); border-left: 2px solid var(--y-accent-fill); padding-left: 8px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dock-head .hbtn { margin-left: auto; }
.dock-msgs { flex: 1; min-height: 0; overflow-y: auto; }
.dock-input { flex: none; display: flex; align-items: center; padding: 10px 12px; border-top: 1px solid var(--y-line); }
.dock-input input { flex: 1; height: 34px; padding: 0 11px; border: 1px solid transparent; border-radius: var(--y-r-md); background: var(--y-surface-2); color: var(--y-text-1); font: inherit; font-size: 13px; outline: none; transition: all var(--y-dur-2); }
.dock-input input:focus { background: var(--y-bg); border-color: var(--y-line-strong); }
.scrim { position: fixed; inset: 0; background: linear-gradient(90deg, transparent 55%, var(--y-scrim)); opacity: 0; pointer-events: none; transition: opacity 180ms var(--ease-out); z-index: 20; }
.scrim.open { opacity: 1; pointer-events: auto; }

/* Toast */
.toast { position: fixed; bottom: 64px; left: 50%; transform: translate(-50%, 4px); opacity: 0; pointer-events: none; display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: var(--y-surface); border: 1px solid var(--y-line-strong); border-radius: var(--y-r-md); box-shadow: var(--y-e1); font-size: 12px; color: var(--y-text-1); z-index: 60; transition: transform var(--y-dur-2) var(--ease-out), opacity var(--y-dur-2) var(--ease-out); }
.toast.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.toast button { border: none; background: none; color: var(--y-accent-text); font-size: 12px; font-weight: 500; cursor: pointer; padding: 0; }

/* 对话 toggle（头部） */
.ctoggle { height: 28px; padding: 0 12px; border: 1px solid transparent; border-radius: var(--y-r-sm); background: none; color: var(--y-text-2); font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all var(--y-dur-1); }
.ctoggle:hover { background: var(--y-surface-2); color: var(--y-text-1); }
.ctoggle.on { background: var(--y-accent-soft); color: var(--y-accent-text); }
.ctoggle .tico { display: grid; place-items: center; }
.ctoggle .tico svg { width: 13px; height: 13px; }

/* 面板 footer */
.p-foot { flex: none; height: 28px; display: flex; align-items: center; padding: 0 16px; border-top: 1px solid var(--y-line); font-size: 10px; color: var(--y-text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 全屏对话态：看板 DOM 保留仅隐藏（滚动位置与筛选不丢），footer 同步隐藏 */

/* 时段 chip（工具条） */
.range-chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border: none; border-radius: var(--y-r-sm); background: var(--y-accent-soft); color: var(--y-accent-text); font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 11px; cursor: pointer; transition: all var(--y-dur-1); }

/* 筛选菜单控件 */
.msel { width: 100%; height: 28px; margin: 2px 0 4px; padding: 0 8px; border: 1px solid var(--y-line-strong); border-radius: var(--y-r-sm); background: var(--y-surface-2); color: var(--y-text-1); font: inherit; font-size: 12px; outline: none; cursor: pointer; }

.mdate { flex: 1; min-width: 0; height: 28px; padding: 0 6px; border: 1px solid var(--y-line-strong); border-radius: var(--y-r-sm); background: var(--y-surface-2); color: var(--y-text-1); font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 11px; outline: none; color-scheme: dark; }

.menu-clear { padding: 4px 2px 2px; }
.menu-clear .btn { width: 100%; justify-content: center; height: 26px; font-size: 11px; color: var(--y-text-3); }
.menu-clear .btn:hover { color: var(--y-text-1); }

/* dock 头部动作 */
.dact { height: 22px; padding: 0 8px; margin-left: auto; border: 1px solid var(--y-line-strong); border-radius: var(--y-r-sm); background: none; color: var(--y-text-2); font-size: 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; transition: all var(--y-dur-1); }

.dact .tico svg { width: 11px; height: 11px; }

/* 台账跳转徽标 */
.lg-src-btn { flex: none; display: inline-flex; align-items: center; gap: 3px; max-width: 150px; border: none; background: none; padding: 1px 4px; margin-right: -4px; border-radius: 4px; font-size: 11px; color: var(--y-text-3); cursor: pointer; transition: all var(--y-dur-1); }
.lg-src-btn:hover { color: var(--y-accent-text); background: var(--y-accent-soft); }
.lg-src-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 原型控制 */
.proto { position: fixed; left: 12px; bottom: 64px; width: 150px; display: flex; flex-direction: column; gap: 5px; padding: 10px; background: var(--y-surface); border: 1px solid var(--y-line-strong); border-radius: var(--y-r-md); box-shadow: var(--y-e1); z-index: 70; }

.reopen { position: fixed; left: 12px; bottom: 12px; display: none; align-items: center; gap: 8px; height: 34px; padding: 0 14px; background: var(--y-surface); border: 1px solid var(--y-line-strong); border-radius: var(--y-r-md); box-shadow: var(--y-e1); color: var(--y-text-2); font-size: 12px; cursor: pointer; z-index: 80; }

/* ============ 工具 ============ */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowHM = () => { const d = new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
const openTasks = () => S.tasks.filter(t => t.status !== 'done');
const bucketCount = (b) => openTasks().filter(t => t.bucket === b).length;

/* —— 时段窗口（与 src/shared/filters.ts 同逻辑：本地日期、含当天、周一为一周之始） —— */
const localDate = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const TODAY = localDate(new Date());
function addDays(day, n) { const d = new Date(`${day}T00:00:00`); d.setDate(d.getDate() + n); return localDate(d); }
function rangeOfPreset(kind) {
  if (kind === 'today') return { rangeFrom: TODAY, rangeTo: TODAY };
  if (kind === 'thisWeek') {
    const offset = (new Date(`${TODAY}T00:00:00`).getDay() + 6) % 7;
    const monday = addDays(TODAY, -offset);
    return { rangeFrom: monday, rangeTo: addDays(monday, 6) };
  }
  const ym = TODAY.slice(0, 7);
  return { rangeFrom: `${ym}-01`, rangeTo: localDate(new Date(Number(TODAY.slice(0, 4)), Number(TODAY.slice(5, 7)), 0)) };
}
function matchRangePreset(from, to) {
  if (from === null && to === null) return null;
  for (const k of ['today', 'thisWeek', 'thisMonth']) {
    const p = rangeOfPreset(k);
    if (p.rangeFrom === from && p.rangeTo === to) return k;
  }
  return 'custom';
}
function rangeLabel(from, to) {
  const short = (d) => `${Number(d.slice(5, 7))}/${Number(d.slice(8, 10))}`;
  if (from !== null && to !== null) return `${short(from)}~${short(to)}`;
  if (from !== null) return `${short(from)} 起`;
  if (to !== null) return `至 ${short(to)}`;
  return '';
}
const fmtDay = (dd) => { const d = new Date(`${addDays(TODAY, dd)}T00:00:00`); const wd = '日一二三四五六'[d.getDay()]; const s = `${d.getMonth()+1}/${d.getDate()}`; return dd === 0 ? '今天' : dd === 1 ? '明天' : `周${wd} ${s}`; };

let toastTimer;
function toast(text, act) {
  const el = $('#toast');
  el.innerHTML = esc(text) + (act ? `<button id="toastAct">${esc(act.label)}</button>` : '');
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), act ? 4000 : 2400);
  if (act) $('#toastAct').onclick = () => { el.classList.remove('show'); act.fn(); };
}

function logEvent(type, sum, src) {
  S.events.unshift({ t: nowHM(), type, sum, src });
}

/* ============ 渲染 ============ */
let prevCounts = {};
function renderCapsules() {
  const html = SECTIONS.map(s => {
    const n = bucketCount(s.key);
    return `<button class="cap${S.bucket === s.key ? ' on' : ''}" data-bucket="${s.key}" aria-label="筛选${s.name}"><span>${s.name}</span><span class="num" data-b="${s.key}">${n}</span></button>`;
  }).join('');
  $('#caps').innerHTML = html;
  SECTIONS.forEach(s => {
    const el = $(`.num[data-b="${s.key}"]`);
    if (prevCounts[s.key] !== undefined && prevCounts[s.key] !== bucketCount(s.key)) {
      el.classList.remove('tick'); void el.offsetWidth; el.classList.add('tick');
    }
  });
  prevCounts = { overdue: bucketCount('overdue'), today: bucketCount('today'), week: bucketCount('week'), stale: bucketCount('stale') };
}

function passesFilters(t) {
  const f = S.filters;
  if (f.overdue && t.bucket !== 'overdue') return false;
  if (f.inprog && t.status !== 'in_progress') return false;
  if (f.stale && t.bucket !== 'stale') return false;
  if (f.ms && t.milestone !== f.ms) return false;
  if (f.kw && !t.title.toLowerCase().includes(f.kw.toLowerCase())) return false;
  if (f.rangeFrom !== null || f.rangeTo !== null) {
    if (t.dd === null || t.dd === undefined) return false;
    const due = addDays(TODAY, t.dd);
    if (f.rangeFrom !== null && due < f.rangeFrom) return false;
    if (f.rangeTo !== null && due > f.rangeTo) return false;
  }
  return true;
}

function rowHTML(t) {
  if (S.editingId === t.id) return editFormHTML(t);
  const cls = [t.bucket === 'overdue' ? 'overdue' : '', t.status === 'in_progress' ? 'inprog' : '', S.flashId === t.id ? 'new' : ''].join(' ');
  const flag = t.prio === 'urgent' ? `<svg class="ic urgent" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 14V3.5"/><path d="M4.5 4h7l-1.5 2.5L11.5 9h-7"/></svg>`
    : t.prio === 'high' ? `<svg class="ic" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 14V3.5"/><path d="M4.5 4h7l-1.5 2.5L11.5 9h-7"/></svg>` : '';

    t.milestone ? `<span class="ms-chip" data-ms="${esc(t.milestone)}">${ICON.chevron}<span>${esc(t.milestone)}</span></span>` : '',
    t.source ? `<span class="src">${ICON.pin}<span>${esc(t.source)}</span></span>` : '',
  ].filter(Boolean).join('<span class="sep">·</span>');
  return `
  <div class="row ${cls}" data-id="${t.id}" tabindex="0" role="listitem" aria-label="${esc(t.title)}，${esc(t.due)}">
    <button class="ctl" data-act="done" aria-label="完成 ${esc(t.title)}">${ICON.check.replace('stroke-width="1.5"','stroke-width="2"')}</button>
    <div class="row-main">
      <div class="row-title">${flag}<span class="tt">${esc(t.title)}</span>${t.status === 'in_progress' ? '<span class="inprog-tag">进行中</span>' : ''}</div>
      <div class="row-meta">${meta}</div>
    </div>
    <div class="row-acts">
      <button class="act" data-act="done" title="完成">${ICON.check}</button>
      <button class="act" data-act="plus1d" title="推迟 1 天">${ICON.plusDay}</button>
      <button class="act" data-act="edit" title="编辑">${ICON.dots}</button>
      <button class="act" data-act="chat" title="聊一聊">${ICON.chat}</button>
    </div>
  </div>`;
}

function editFormHTML(t) {

function renderTasks() {
  const box = $('#viewKanban');
  let html = `<div id="notifDeck">${renderNotifs()}</div><div id="taskList" role="list">`;
  if (S.preset === 'done') {
    const doneAll = S.done.concat(S.tasks.filter(t => t.status === 'done').map(t => ({ id: t.id, title: t.title, doneLabel: '完成 ' + (t.doneAt || nowHM()), source: t.source || '看板' })));
    html += sectionHTML('已完成', doneAll.length, doneAll.map(d => `
      <div class="row-wrap"><div class="row done-row" data-did="${d.id}" tabindex="0" role="listitem" aria-label="${esc(d.title)}，已完成">
        <button class="ctl done" aria-label="已完成">${ICON.check.replace('stroke-width="1.5"','stroke-width="2"')}</button>
        <div class="row-main">
          <div class="row-title"><span class="tt">${esc(d.title)}</span></div>
          <div class="row-meta"><span class="due">完成 ${esc(d.doneLabel)}</span><span class="sep">·</span><span class="src">${ICON.pin}<span>${esc(d.source)}</span></span></div>
        </div>
      </div></div>`).join(''));
  } else {
    const allowed = S.preset === 'today' ? ['overdue', 'today'] : SECTIONS.map(s => s.key);
    const buckets = S.bucket ? [S.bucket] : allowed;
    let total = 0;
    buckets.forEach(b => {
      const rows = openTasks().filter(t => t.bucket === b && allowed.includes(t.bucket) && passesFilters(t));
      total += rows.length;
      const def = SECTIONS.find(s => s.key === b);
      html += sectionHTML(def.name, rows.length, rows.map(t => `<div class="row-wrap" data-wid="${t.id}">${rowHTML(t)}</div>`).join(''), b === 'overdue');
    });
    if (total === 0) html += `<div class="empty"><h4>没有符合条件的事</h4><p>换个预设或清除筛选试试</p></div>`;
    if (openTasks().length === 0 && !S.filters.kw) html = `<div id="notifDeck">${renderNotifs()}</div><div class="empty"><h4>今天没有挂起的事</h4><p>说一句，我来记下</p></div>`;
  }
  html += `</div>`;
  html += renderFoldGoals() + renderFoldLedger();
  box.innerHTML = html;
}

  if (!rowsHTML) return '';

  <div class="sec">

}

function goalHTML(g) {

}

function renderAll() {
  renderCapsules();
  renderTasks();
  renderMsgs();
  syncRangeChip();
  syncFilterDot();
  syncFilterControls();
  S.flashId = null; S.flashGoal = null;
}

/* ============ 任务操作 ============ */
function findTask(id) { return S.tasks.find(t => t.id === id); }

function completeTask(id) {
  const t = findTask(id);
  if (!t || t.status === 'done') return;
  t.status = 'done'; t.doneAt = nowHM();
  const rowEl = document.querySelector(`.row[data-id="${id}"]`);
  const wrapEl = document.querySelector(`.row-wrap[data-wid="${id}"]`);
  if (rowEl) { rowEl.classList.add('retire'); const ctl = rowEl.querySelector('.ctl'); if (ctl) ctl.classList.add('done'); }
  const dueEl = rowEl && rowEl.querySelector('.due'); if (dueEl) dueEl.textContent = `完成 ${t.doneAt}`;
  logEvent('完成', t.title, '看板');
  setTimeout(() => {
    if (wrapEl) wrapEl.classList.add('closed');
    setTimeout(() => {
      renderAll();
      toast(`已完成 · ${t.title}`, { label: '撤销', fn: () => {
        t.status = 'open'; t.doneAt = null;
        S.flashId = id; renderAll();
      }});
    }, 170);
  }, 500);
}

function plusOneDay(id) {
  const t = findTask(id); if (!t) return;
  if (t.bucket === 'overdue' || t.bucket === 'stale') { t.bucket = 'today'; t.dd = 0; }
  else if (t.bucket === 'today') { t.bucket = 'week'; t.dd = 1; }
  else { t.dd = (t.dd ?? 7) + 1; }
  t.due = fmtDay(t.dd);
  logEvent('推迟', `${t.title} → ${t.due}`, '看板');
  S.flashId = id; renderAll();
  toast(`已推迟 · ${t.due}`);
}

/* ============ 对话面：一个面、两种尺寸（侧栏 ⇄ 全屏） ============ */
function syncChatSurface() {
  const panel = $('#panel');
  $('#dock').classList.toggle('open', S.dockOpen);
  $('#scrim').classList.toggle('open', S.dockOpen);
  panel.classList.toggle('docked', S.dockOpen);
  $('#dockCtx').textContent = S.anchor ?? '看板全局';
  panel.classList.toggle('chatfs', S.chatFull);
  $('#viewChat').hidden = !S.chatFull;
  $('#chatCapture').hidden = !S.chatFull;
  $('#btnChat').hidden = S.chatFull;
  $('#btnShrink').hidden = !S.chatFull;
  $('#btnChat').classList.toggle('on', S.dockOpen || S.chatFull);
  const fa = $('#fsAnchor');
  fa.textContent = S.anchor ? `锚定 · ${S.anchor}` : '';
  fa.style.display = (S.chatFull && S.anchor) ? '' : 'none';
}

function openDock(anchor) {
  S.anchor = anchor ?? null;
  PERSIST.sideChatOpen = true;
  if ($('#panel').classList.contains('compact')) {
    S.chatFull = true; S.dockOpen = false;
    syncChatSurface();
    setTimeout(() => $('#chatInput').focus(), 200);
    return;
  }
  S.dockOpen = true; S.chatFull = false;
  syncChatSurface();
  setTimeout(() => $('#dockInput').focus(), 220);
}

function closeAllChat() {
  S.dockOpen = false; S.chatFull = false; S.anchor = null;
  PERSIST.sideChatOpen = false;
  syncChatSurface();
  $('#btnChat').focus();
}

function chatReply(text) {
  const replies = [
    '好的，已处理并写入台账。（原型示意回复）',
    '已记录。需要在看板上同步更新吗？（原型示意回复）',
    '收到，这件事我会持续跟进。（原型示意回复）',
  ];
  S.msgs.push({ who: 'ai', text: replies[S.msgs.length % replies.length] });
  renderMsgs();
}

/* ============ 看板事件委托 ============ */
$('#viewKanban').addEventListener('click', (e) => {
  const lgBtn = e.target.closest('.lg-src-btn');
  if (lgBtn) { toast(`已跳转源会话 · ${lgBtn.querySelector('span').textContent}`); return; }
  const nact = e.target.closest('[data-nact]');
  if (nact) {
    const wrap = nact.closest('.notif-wrap');
    const n = S.notifs.find(x => x.id === wrap.dataset.nid);
    const kind = nact.dataset.nact;
    if (kind === 'nok') { dismissNotif(wrap, n); return; }
    if (kind === 'nchat') { openDock(n.type); return; }
    if (kind === 'ndone') { completeTask(n.todoId); dismissNotif(wrap, n); return; }
    if (kind === 'nplus1d') { plusOneDay(n.todoId); dismissNotif(wrap, n); return; }
  }
  const msChip = e.target.closest('.ms-chip');
  if (msChip) {
    S.foldGoals = true; S.flashGoal = null;
    const g = S.goals.find(g => g.ms.some(m => m.name === msChip.dataset.ms));
    if (g) S.flashGoal = g.id;
    renderTasks();
    const goalEl = document.querySelector(`.goal[data-goalblock="${g ? g.id : ''}"]`);
    if (goalEl) goalEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  const foldHead = e.target.closest('#foldGoalsHead');
  if (foldHead) { S.foldGoals = !S.foldGoals; renderTasks(); return; }
  const foldLedger = e.target.closest('#foldLedgerHead');
  if (foldLedger) { S.foldLedger = !S.foldLedger; renderTasks(); return; }
  const goalName = e.target.closest('.goal-name');
  if (goalName) { S.goalEditId = goalName.dataset.goal; renderTasks(); const inp = $('#goalNameInput'); if (inp) { inp.focus(); inp.select(); } return; }
  const msDot = e.target.closest('.ms-dot');
  if (msDot) {
    const g = msDot.dataset.g, i = +msDot.dataset.i;
    S.msPop = (S.msPop && S.msPop.g === g && S.msPop.i === i) ? null : { g, i };
    renderTasks(); return;
  }
  const msSt = e.target.closest('.ms-st');
  if (msSt) {
    const g = S.goals.find(x => x.id === S.msPop.g);
    g.ms[S.msPop.i].st = msSt.dataset.mst;
    S.msPop = null; renderTasks(); return;
  }
  const act = e.target.closest('[data-act]');
  if (!act) return;
  const row = act.closest('.row');
  const id = row.dataset.id;
  const t = findTask(id);
  switch (act.dataset.act) {
    case 'done': completeTask(id); break;
    case 'plus1d': plusOneDay(id); break;
    case 'chat': openDock(t.title); break;
    case 'edit': S.editingId = id; renderTasks(); { const inp = $('#efTitle'); if (inp) inp.focus(); } break;
    case 'cancel': S.editingId = null; S.deletingId = null; renderTasks(); break;
    case 'save': saveEdit(t); break;
    case 'delete': S.deletingId = id; renderTasks(); break;
    case 'del-cancel': S.deletingId = null; renderTasks(); break;
    case 'del-confirm':
      S.tasks = S.tasks.filter(x => x.id !== id);
      logEvent('取消', `${t.title}（已删除，写审计事件）`, '看板');
      S.editingId = null; S.deletingId = null;
      renderAll(); toast('已删除 · 已写审计事件');
      break;
  }
});

function dismissNotif(wrapEl, n) {
  wrapEl.classList.add('closed');
  setTimeout(() => { S.notifs = S.notifs.filter(x => x.id !== n.id); renderTasks(); }, 170);
}

function saveEdit(t) {
  t.title = $('#efTitle').value.trim() || t.title;
  t.due = $('#efDue').value.trim() || t.due;
  t.prio = $('#efPrio').value || null;
  t.milestone = $('#efMs').value || null;
  S.editingId = null; S.deletingId = null;
  S.flashId = t.id;
  logEvent('更新', t.title, '看板');
  renderAll();
}

$('#viewKanban').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'goalNameInput') {
    const g = S.goals.find(x => x.id === S.goalEditId);
    g.name = e.target.value.trim() || g.name;
    S.goalEditId = null; renderTasks(); return;
  }
  if (e.key === 'Enter' && e.target.id === 'msNameInput') {
    const g = S.goals.find(x => x.id === S.msPop.g);
    g.ms[S.msPop.i].name = e.target.value.trim() || g.ms[S.msPop.i].name;
    S.msPop = null; renderTasks(); return;
  }
  if (e.key === 'Enter' && e.target.id === 'efTitle') { saveEdit(findTask(S.editingId)); return; }
  if (e.target.classList.contains('row') && e.target.dataset.id) {
    if (e.key === ' ') { e.preventDefault(); completeTask(e.target.dataset.id); }
    if (e.key === 'e') { S.editingId = e.target.dataset.id; renderTasks(); const inp = $('#efTitle'); if (inp) inp.focus(); }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const rows = [...document.querySelectorAll('.row[data-id]')];
      const idx = rows.indexOf(e.target);
      const next = rows[idx + (e.key === 'ArrowDown' ? 1 : -1)];
      if (next) next.focus();
    }
  }
});

/* ============ 头部 / 工具条 / 捕获条 ============ */
$('#seg').addEventListener('click', (e) => {
  const btn = e.target.closest('.seg-btn'); if (!btn) return;
  document.querySelectorAll('.seg-btn').forEach(b => b.classList.toggle('on', b === btn));
  S.preset = btn.dataset.preset;
  if (S.preset === 'done') S.bucket = null;
  renderCapsules(); renderTasks();
});

$('#caps').addEventListener('click', (e) => {
  const cap = e.target.closest('.cap'); if (!cap) return;
  const b = cap.dataset.bucket;
  S.bucket = S.bucket === b ? null : b;
  if (S.preset === 'done') { document.querySelectorAll('.seg-btn').forEach(x => x.classList.toggle('on', x.dataset.preset === 'today')); S.preset = 'today'; }
  renderCapsules(); renderTasks();
});

/* —— 筛选菜单：状态 / 时段 / 里程碑 / 关键词 / 清除 —— */
const fltMenu = $('#fltMenu'), btnFilter = $('#btnFilter');
function hasDetailFilter() {
  const f = S.filters;
  return !!(f.overdue || f.inprog || f.stale || f.kw || f.ms || f.rangeFrom !== null || f.rangeTo !== null);
}
function syncFilterDot() { btnFilter.classList.toggle('has-filters', hasDetailFilter()); }
function syncRangeChip() {
  const chip = $('#rangeChip');
  const has = S.filters.rangeFrom !== null || S.filters.rangeTo !== null;
  chip.hidden = !has;
  if (has) chip.innerHTML = `<b>${esc(rangeLabel(S.filters.rangeFrom, S.filters.rangeTo))}</b> ✕`;
}
function syncFilterControls() {
  ['overdue', 'inprog', 'stale'].forEach(f => { const ck = fltMenu.querySelector(`.ck[data-ck="${f}"]`); if (ck) ck.classList.toggle('on', !!S.filters[f]); });
  const m = matchRangePreset(S.filters.rangeFrom, S.filters.rangeTo);
  const sel = $('#fltRange');
  let customOpt = sel.querySelector('option[value="custom"]');
  if (m === 'custom' && !customOpt) { customOpt = document.createElement('option'); customOpt.value = 'custom'; customOpt.textContent = '自定义'; sel.appendChild(customOpt); }
  if (m !== 'custom' && customOpt) customOpt.remove();
  sel.value = m ?? '';
  $('#fltFrom').value = S.filters.rangeFrom ?? '';
  $('#fltTo').value = S.filters.rangeTo ?? '';
  const msSel = $('#fltMs');
  const names = [...new Set(S.goals.flatMap(g => g.ms.map(x => x.name)))];
  msSel.innerHTML = '<option value="">全部</option>' + names.map(n => `<option value="${esc(n)}"${S.filters.ms === n ? ' selected' : ''}>${esc(n)}</option>`).join('');
  const kwEl = $('#fltKw'); if (kwEl.value !== (S.filters.kw ?? '')) kwEl.value = S.filters.kw ?? '';
  $('#fltClearWrap').hidden = !hasDetailFilter();
}
function afterFilterChange() {
  syncFilterDot(); syncRangeChip(); renderTasks(); syncFilterControls();
}
btnFilter.addEventListener('click', (e) => { e.stopPropagation(); syncFilterControls(); fltMenu.classList.toggle('open'); });
fltMenu.addEventListener('click', (e) => {
  const row = e.target.closest('.mrow[data-f]'); if (!row || row.classList.contains('mrow--static')) return;
  const f = row.dataset.f;
  S.filters[f] = !S.filters[f];
  row.querySelector('.ck').classList.toggle('on', S.filters[f]);
  afterFilterChange();
});
$('#fltRange').addEventListener('change', (e) => {
  const v = e.target.value;
  if (!v) { S.filters.rangeFrom = null; S.filters.rangeTo = null; }
  else if (v === 'custom') return;
  else { const p = rangeOfPreset(v); S.filters.rangeFrom = p.rangeFrom; S.filters.rangeTo = p.rangeTo; }
  afterFilterChange();
});
$('#fltFrom').addEventListener('change', (e) => { S.filters.rangeFrom = e.target.value || null; afterFilterChange(); });
$('#fltTo').addEventListener('change', (e) => { S.filters.rangeTo = e.target.value || null; afterFilterChange(); });
$('#fltMs').addEventListener('change', (e) => { S.filters.ms = e.target.value || null; afterFilterChange(); });
$('#fltKw').addEventListener('input', (e) => { S.filters.kw = e.target.value; afterFilterChange(); });
$('#fltClear').addEventListener('click', () => {
  S.filters = { overdue:false, inprog:false, stale:false, kw:'', ms:null, rangeFrom:null, rangeTo:null };
  afterFilterChange();
});
$('#rangeChip').addEventListener('click', () => {
  S.filters.rangeFrom = null; S.filters.rangeTo = null;
  afterFilterChange();
});

const capInput = $('#capInput'), enterHint = $('#enterHint');
capInput.addEventListener('input', () => enterHint.classList.toggle('lit', !!capInput.value.trim()));
capInput.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || e.isComposing) return;
  const text = capInput.value.trim(); if (!text) return;
  capInput.value = ''; enterHint.classList.remove('lit');
  const id = 'x' + Date.now();
  S.tasks.push({ id, title: text, bucket: 'today', dd: 0, due: '今天', prio: null, milestone: null, source: '快速记一条', status: 'open' });
  logEvent('新增', text, '快速记一条');
  S.flashId = id;
  renderAll();
  toast('已记下 · 今日到期');
});

/* ============ 头部按钮 / 对话面 ============ */
$('#btnChat').addEventListener('click', () => {
  if (S.dockOpen || S.chatFull) { closeAllChat(); return; }
  openDock(null);
});
$('#btnShrink').addEventListener('click', () => {
  S.chatFull = false; S.dockOpen = true;
  syncChatSurface();
  setTimeout(() => $('#dockInput').focus(), 200);
});
$('#dockExpand').addEventListener('click', () => {
  S.chatFull = true; S.dockOpen = false;
  syncChatSurface();
  setTimeout(() => $('#chatInput').focus(), 200);
});
$('#dockClose').addEventListener('click', closeAllChat);
$('#scrim').addEventListener('click', closeAllChat);
function sendChat(el) {
  const text = el.value.trim(); if (!text) return;
  el.value = '';
  S.msgs.push({ who: 'me', text });
  renderMsgs();
  setTimeout(() => chatReply(text), 600);
}
$('#dockInput').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) sendChat(e.target); });
$('#chatInput').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) sendChat(e.target); });
$('#btnClose').addEventListener('click', () => { $('#stage').classList.add('closed'); $('#reopen').classList.add('show'); });
$('#reopen').addEventListener('click', () => { $('#stage').classList.remove('closed'); $('#reopen').classList.remove('show'); });

/* 刷新：扫线 + 数据变化演示 */
$('#btnRefresh').addEventListener('click', (e) => {
  const btn = e.currentTarget;
  btn.classList.remove('spin'); void btn.offsetWidth; btn.classList.add('spin');
  const sweep = $('#sweep');
  sweep.classList.remove('run'); void sweep.offsetWidth; sweep.classList.add('run');
  setTimeout(() => {
    S.syncN += 1;
    const id = 's' + S.syncN;
    S.tasks.push({ id, title: `同步评审结论 · #${S.syncN}`, bucket: 'week', dd: 4, due: fmtDay(4), prio: null, milestone: null, source: 'YOLO', status: 'open' });
    logEvent('新增', `同步评审结论 · #${S.syncN}`, 'YOLO');
    S.flashId = id;
    renderAll();
  }, 260);
});

/* ============ 全局键盘 ============ */
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (fltMenu.classList.contains('open')) { fltMenu.classList.remove('open'); return; }
  if (S.msPop) { S.msPop = null; renderTasks(); return; }
  if (S.editingId) { S.editingId = null; S.deletingId = null; renderTasks(); return; }
  if (S.chatFull) {
    if ($('#panel').classList.contains('compact')) { closeAllChat(); return; }
    S.chatFull = false; S.dockOpen = true;
    syncChatSurface();
    setTimeout(() => $('#dockInput').focus(), 200);
    return;
  }
  if (S.dockOpen) { closeAllChat(); return; }
  $('#stage').classList.add('closed'); $('#reopen').classList.add('show');
});
document.addEventListener('click', (e) => {
  if (!fltMenu.classList.contains('open')) return;
  if (!e.target.closest('.flt-wrap')) fltMenu.classList.remove('open');
});

/* ============ 原型控制 ============ */
const WIDTHS = [['full', '全宽', '100%'], ['mid', '中 · 760', '760px'], ['narrow', '窄 · 480', '480px']];
let widthIdx = 0;
function syncProto() {
  const dark = document.documentElement.dataset.theme === 'dark';
  $('#pTheme').innerHTML = (dark ? ICON.sun : ICON.moon) + (dark ? '亮色主题' : '暗色主题');
  $('#pWidth').innerHTML = ICON.layout + '宽度 · ' + WIDTHS[widthIdx][1];
  const reduced = document.documentElement.dataset.motion === 'reduced';
  $('#pMotion').textContent = reduced ? '动效 · 已降级' : '动效 · 开启';
}
$('#pTheme').addEventListener('click', () => {
  document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  syncProto();
});
$('#pWidth').addEventListener('click', () => {
  widthIdx = (widthIdx + 1) % WIDTHS.length;
  document.documentElement.style.setProperty('--pw', WIDTHS[widthIdx][2]);
  $('#panel').classList.toggle('compact', WIDTHS[widthIdx][0] === 'narrow');
  $('#dock').classList.toggle('full', WIDTHS[widthIdx][0] === 'narrow');
  syncProto();
});
$('#pMotion').addEventListener('click', () => {
  document.documentElement.dataset.motion = document.documentElement.dataset.motion === 'reduced' ? 'on' : 'reduced';
  syncProto();
});
$('#pReset').addEventListener('click', () => {
  initState();
  S.dockOpen = PERSIST.sideChatOpen; S.anchor = null; S.chatFull = false;
  syncChatSurface();
  showSkeleton();
});

/* ============ 初始化 ============ */
function showSkeleton() {
  $('#viewKanban').innerHTML = `
    <div class="skel-notif"></div><div class="skel-notif" style="height:64px"></div>
    <div class="skel-head"></div>
    <div class="skel-row"></div><div class="skel-row"></div><div class="skel-row"></div>
    <div class="skel-head"></div>
    <div class="skel-row"></div><div class="skel-row"></div><div class="skel-row"></div>`;
  setTimeout(() => { renderAll(); }, 550);
}

(function init() {
  $('#logoBox').innerHTML = ICON.logo.replace('width="16" height="16"', 'width="18" height="18"');
  $('#btnChatIcon').innerHTML = ICON.chat;
  $('#btnShrinkIcon').innerHTML = ICON.shrink;
  $('#dockExpandIcon').innerHTML = ICON.expand;
  $('#btnRefresh').innerHTML = ICON.refresh;
  $('#btnClose').innerHTML = ICON.close;
  $('#dockClose').innerHTML = ICON.close;
  $('#fltIcon').innerHTML = ICON.filter.replace('width="16" height="16"', 'width="12" height="12"');
  $('#fltChev').innerHTML = ICON.chevron.replace('width="16" height="16"', 'width="10" height="10"');
  $('#reopenIcon').innerHTML = ICON.logo.replace('width="16" height="16"', 'width="14" height="14"');
  const d = new Date();
  $('#headDate').textContent = `${d.getMonth() + 1}月${d.getDate()}日 · 周${'日一二三四五六'[d.getDay()]}`;
  initState();
  syncProto();
  syncChatSurface();
  showSkeleton();
  if (PERSIST.sideChatOpen) setTimeout(() => openDock(null), 750);
})();
</script>
</body>
