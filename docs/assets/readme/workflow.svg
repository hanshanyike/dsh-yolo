      <text x="110" y="124" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#171724">整理</text>
      <text x="110" y="153" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#6B6B7B">Organize</text>
