    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#312E81" flood-opacity=".08"/>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="30" fill="#F7F7FC"/>
  <g fill="none" stroke="#B7C8FE" stroke-width="3" marker-end="url(#arrow)">
