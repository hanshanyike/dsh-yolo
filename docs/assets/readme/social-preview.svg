<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">YOLO — Say it once. Keep it on track.</title>
  <desc id="desc">Social preview for the YOLO personal assistant plugin for deepseek-harness.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#283142"/>
      <stop offset="1" stop-color="#4176E6"/>
    </linearGradient>
    <clipPath id="shot">
      <rect x="666" y="112" width="548" height="416" rx="24"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#09091A" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1180" cy="18" r="240" fill="#FFFFFF" opacity=".04"/>
  <circle cx="70" cy="650" r="260" fill="#FFFFFF" opacity=".035"/>
  <image href="../../logo.svg" x="76" y="88" width="88" height="88" preserveAspectRatio="xMidYMid meet"/>
  <text x="188" y="151" font-family="system-ui, sans-serif" font-size="62" font-weight="800" letter-spacing="2" fill="#FFFFFF">YOLO</text>
  <text x="76" y="253" font-family="system-ui, sans-serif" font-size="45" font-weight="750" fill="#FFFFFF">交代一次，持续跟进。</text>
  <text x="76" y="306" font-family="system-ui, sans-serif" font-size="25" fill="#E0E7FF">Say it once. Keep it on track.</text>
  <text x="76" y="372" font-family="system-ui, sans-serif" font-size="22" fill="#C7D2FE">从对话中整理计划，在合适的时候提醒，</text>
  <text x="76" y="408" font-family="system-ui, sans-serif" font-size="22" fill="#C7D2FE">并持续跟进。</text>
  <g transform="translate(76 472)" font-family="system-ui, sans-serif" font-size="17" font-weight="650" fill="#FFFFFF">
    <rect width="148" height="44" rx="22" fill="#FFFFFF" opacity=".13"/>
    <text x="74" y="29" text-anchor="middle">跨会话整理</text>
    <rect x="160" width="128" height="44" rx="22" fill="#FFFFFF" opacity=".13"/>
    <text x="224" y="29" text-anchor="middle">本地优先</text>
    <rect x="300" width="148" height="44" rx="22" fill="#FFFFFF" opacity=".13"/>
    <text x="374" y="29" text-anchor="middle">低打扰提醒</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="650" y="96" width="580" height="448" rx="30" fill="#FFFFFF" opacity=".98"/>
    <image href="dashboard-home.png" x="666" y="112" width="548" height="416" preserveAspectRatio="xMidYMid slice" clip-path="url(#shot)"/>
  </g>
</svg>
