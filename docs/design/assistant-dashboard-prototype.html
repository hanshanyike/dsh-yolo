<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="../logo.svg">
<title>YOLO · 一起把事情理顺 · 产品原型</title>
<style>
:root{--bg:#f7f7fa;--s:#fff;--s2:#f0f1f7;--line:#dedfea;--ink:#1c1d2a;--muted:#6e7081;--focus:#5d55d9;--soft:#eeedff;--r:14px;--shadow:0 12px 34px #1e1f3714;font:14px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:inherit}button{min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--s);color:inherit;font:inherit;cursor:pointer}button:hover{border-color:var(--focus)}button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.host{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:100vh}.rail{padding:22px 14px;border-right:1px solid var(--line);background:#efeff4;color:var(--muted)}.rail strong{display:block;margin:0 10px 28px;color:var(--ink)}.rail p{margin:12px 10px;font-size:12px}.session{margin:5px 0;padding:8px 10px;border-radius:8px}.session.active{background:#deddf0;color:var(--ink)}.entry{display:flex;justify-content:space-between;margin-top:24px;padding:10px;border-color:var(--focus)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--focus);color:#fff;font-size:11px}.workbench{min-width:0;padding:24px}.panel{display:flex;min-height:calc(100vh - 48px);overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--s);box-shadow:var(--shadow)}.board{min-width:0;flex:1;overflow:auto}.bar,.tabs{display:flex;align-items:center;border-bottom:1px solid var(--line)}.bar{justify-content:space-between;gap:18px;padding:17px 22px}.brand{display:flex;align-items:baseline;gap:10px}.mark{display:grid;place-items:center;width:27px;height:27px;border-radius:8px;background:var(--focus);color:#fff;font-weight:800}.brand small{color:var(--muted)}.bar-actions{display:flex;gap:8px}.primary{border-color:var(--focus);background:var(--soft);color:#433ca5;font-weight:700}.tabs{gap:2px;padding:0 22px}.tab{min-height:44px;border:0;border-radius:0;background:transparent;color:var(--muted)}.tab.active{border-bottom:2px solid var(--focus);color:var(--ink);font-weight:750}.content{max-width:840px;margin:auto;padding:30px 30px 70px}.eyebrow{margin:0;color:var(--muted);font-size:12px}.content h1{margin:7px 0 6px;font-size:30px;line-height:1.2}.content h2{margin:0;font-size:16px}.summary{margin:0;color:var(--muted)}.capture{display:flex;gap:8px;margin:22px 0}.capture input{min-width:0;flex:1;border:1px solid var(--focus);border-radius:9px;padding:0 12px;font:inherit}.judgment{margin:22px 0;padding:18px;border:1px solid var(--line);border-left:3px solid var(--focus);border-radius:var(--r);box-shadow:var(--shadow)}.jhead{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.judgment h2{margin-top:8px;font-size:19px}.judgment p{margin:7px 0;color:var(--muted)}.evidence{display:flex;flex-wrap:wrap;gap:6px;margin:13px 0}.evidence span{padding:3px 8px;border:1px solid var(--line);border-radius:99px;color:var(--muted);font-size:12px}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}.section{margin-top:27px}.section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}.section-head span{color:var(--muted);font-size:12px}.task-list{margin:0;padding:0 14px;list-style:none;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}.task{display:grid;grid-template-columns:21px minmax(0,1fr) auto;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}.task input{width:18px;height:18px;margin-top:3px;accent-color:var(--focus)}.task strong{display:block}.task small{display:block;margin-top:4px;color:var(--muted)}.source{min-height:28px;margin-top:7px;padding:0;border:0;background:transparent;color:var(--muted);font-size:12px}.recent{margin:0;padding-left:19px;color:var(--muted)}.context{width:340px;flex:0 0 340px;border-left:1px solid var(--line);background:var(--s2)}.context[hidden]{display:none}.ctx-head{display:flex;justify-content:space-between;padding:16px;border-bottom:1px solid var(--line)}.ctx-body{padding:18px 16px}.ctx-body h2{margin-bottom:13px;font-size:20px}.ctx-body p{color:var(--muted)}.quote{margin:17px 0;padding:12px;border-left:2px solid var(--focus);background:var(--s);}.message{max-width:92%;margin:10px 0;padding:9px 11px;border-radius:10px;background:var(--s)}.message.me{margin-left:auto;background:var(--soft)}.chat-input{width:100%;margin-top:20px;padding:10px;border:1px solid var(--line);border-radius:9px;font:inherit}.note{margin-top:24px;padding:11px 13px;border-radius:9px;background:var(--soft);color:#433ca5;font-size:12px}
@media(max-width:900px){.host{display:block}.rail{display:none}.workbench{padding:0}.panel{min-height:100vh;border:0;border-radius:0}.context{position:fixed;inset:0;z-index:2;width:auto;border:0}.ctx-body{max-width:560px;margin:auto;padding:28px 24px}}@media(max-width:480px){.bar,.tabs{padding-left:14px;padding-right:14px}.content{padding:22px 16px 50px}.content h1{font-size:25px}}
</style>
</head>
<body>
<div class="host"><aside class="rail" aria-label="宿主侧栏"><strong>deepseek-harness</strong><p>会话</p><div class="session active">客户回访安排</div><div class="session">发布准备讨论</div><div class="session">新会话</div><button class="entry" type="button"><span>YOLO 助手</span><span class="badge">2</span></button></aside>
<main class="workbench"><div class="panel"><section class="board" aria-label="YOLO，一起把事情理顺"><header class="bar"><div class="brand"><img class="mark" src="../logo.svg" alt="YOLO logo"><strong>YOLO</strong><small>一起把事情理顺 · 原型</small></div><div class="bar-actions"><button type="button" id="assistant">和助手聊聊</button><button type="button">通知 <span class="badge">2</span></button></div></header><nav class="tabs" aria-label="助手页面"><button class="tab active" data-page="home" type="button">首页</button><button class="tab" data-page="plan" type="button">计划</button><button class="tab" data-page="history" type="button">历史</button></nav><div class="content" id="content"></div></section><aside class="context" id="context" aria-label="上下文" hidden></aside></div></main></div>
<script>
const state={page:"home",context:null},items=[{title:"把客户回访材料发给研发",meta:"今天 · 客户回访安排",source:"客户回访会话"},{title:"确认发布说明中的升级步骤",meta:"明天 · 发布准备讨论",source:"发布准备讨论"},{title:"整理下月访谈计划",meta:"2026-09-12 · 研究项目",source:"研究项目会话"}],content=document.querySelector("#content"),context=document.querySelector("#context");
const esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const task=i=>'<li class="task"><input type="checkbox" aria-label="完成 '+esc(i.title)+'"><div><strong>'+esc(i.title)+'</strong><small>'+esc(i.meta)+'</small><button class="source" type="button" data-source="'+esc(i.title)+'">来源 · '+esc(i.source)+'</button></div><button class="primary" type="button" data-discuss="'+esc(i.title)+'">讨论这项安排</button></li>';
const section=(title,rows)=>'<section class="section"><div class="section-head"><h2>'+title+'</h2><span>'+rows.length+' 件</span></div><ul class="task-list">'+rows.map(task).join("")+'</ul></section>';
function home(){content.innerHTML='<header><p class="eyebrow">2026 年 8 月 27 日 · 星期四</p><h1>今天有 2 件事需要你处理。</h1><p class="summary">重点安排 2 件 · 全部挂起 3 件 · 今天到期 1 件</p></header><div class="capture"><input placeholder="记一件事，回车保存（默认今天到期）"><button class="primary" type="button">快速记录</button></div><article class="judgment"><div class="jhead"><span>助手判断 · 需要你回应</span><time>刚刚</time></div><h2>把客户回访材料发给研发</h2><p>原定今天完成，目前仍未确认发送；现在处理可以避免明天的发布准备被动等待。</p><div class="evidence"><span>截止时间：今天</span><span>来自：客户回访会话</span></div><div class="actions"><button class="primary" type="button" data-detail="把客户回访材料发给研发">处理</button><button type="button" data-source="把客户回访材料发给研发">查看来源</button><button type="button" data-discuss="把客户回访材料发给研发">讨论这项安排</button></div></article>'+section("需要处理",[items[1]])+'<section class="section"><div class="section-head"><h2>接下来</h2><span>有明确日期的安排</span></div><ul class="task-list">'+task(items[2])+'</ul></section><section class="section"><div class="section-head"><h2>最近变化</h2><span>进入历史查看全部</span></div><ul class="recent"><li>已将发布说明推迟到明天</li><li>新增客户回访材料安排</li></ul></section><p class="note">原型说明：提醒折叠进事项，来源先预览；上下文打开后只出现一个 340px 前景区。</p>'}
function plan(){content.innerHTML='<header><p class="eyebrow">开放安排</p><h1>计划</h1><p class="summary">按时间和长期目标组织所有仍需跟进的事项。</p></header><div class="tabs" style="padding:0;margin-top:22px;border:0"><button class="tab active" type="button">今天</button><button class="tab" type="button">接下来</button><button class="tab" type="button">目标</button><button class="tab" type="button">全部</button></div>'+section("今天",[items[0],items[1]])+section("接下来",[items[2]])}
function history(){content.innerHTML='<header><p class="eyebrow">已发生的变化</p><h1>历史</h1><p class="summary">完成与取消单独保存，最近变化保持低噪可追溯。</p></header>'+section("已结束",[{title:"把上周会议纪要发给产品组",meta:"已完成 · 昨天",source:"周会会话"}])+'<section class="section"><div class="section-head"><h2>最近变化</h2><span>3 条</span></div><ul class="recent"><li>完成：把采购确认结果同步给财务</li><li>推迟：确认发布说明中的升级步骤</li><li>新增：把客户回访材料发给研发</li></ul></section>'}
function ctx(){if(!state.context){context.hidden=true;context.innerHTML="";return}context.hidden=false;const t=esc(state.context.title);if(state.context.type==="source"){context.innerHTML='<header class="ctx-head"><strong>来源</strong><button type="button" data-close>关闭</button></header><div class="ctx-body"><p class="eyebrow">会话来源 · 客户回访会话</p><h2>'+t+'</h2><p>工作区 · 客户项目</p><div class="quote">周五前把回访材料发给研发，先确认最终数字。</div><p>记录时间 · 2026-08-27 10:14<br>会话轮次 · 6（定位元数据）</p><div class="actions"><button type="button" data-discuss="'+t+'">讨论这项安排</button><button class="primary" type="button">打开原会话</button></div></div>'}else{context.innerHTML='<header class="ctx-head"><strong>助手对话</strong><button type="button" data-close>关闭</button></header><div class="ctx-body"><div class="message">我可以帮你查看安排、解释变化，或讨论下一步。</div><div class="message me">'+t+'</div><div class="message">这项安排目前仍开放。需要我把截止时间或处理方式一起调整吗？</div><input class="chat-input" placeholder="继续和助手交流…"></div>'}}
function render(){document.querySelectorAll("[data-page]").forEach(t=>t.classList.toggle("active",t.dataset.page===state.page));if(state.page==="home")home();else if(state.page==="plan")plan();else history();ctx()}
document.addEventListener("click",e=>{const p=e.target.closest("[data-page]");if(p){state.page=p.dataset.page;state.context=null;render();return}const d=e.target.closest("[data-discuss]");if(d){state.context={type:"chat",title:d.dataset.discuss};ctx();return}const s=e.target.closest("[data-source]");if(s){state.context={type:"source",title:s.dataset.source};ctx();return}if(e.target.closest("#assistant")){state.context={type:"chat",title:"我想盘点一下今天的安排"};ctx();return}if(e.target.closest("[data-close]")){state.context=null;ctx()}});render();
</script>
</body>
</html>
