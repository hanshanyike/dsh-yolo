# YOLO development patch (load plugins from source, no build needed).
# Use with: node --import tsx/esm <host>/apps/cli/src/bin.ts web --patch D:/Code/WorkBuddy/dsh-yolo/cordis.dev.yml --no-open
# IMPORTANT (Windows): `name` must be a `file://` URL, NOT a bare `D:/...` path.
# Node's ESM loader treats a bare `D:/...` as protocol "d:" and rejects it
# (ERR_UNSUPPORTED_ESM_URL_SCHEME). Use the file:///<drive>/abs/path form.
- insert:
  # M1: storage service (ctx.yolo) + memory tools. M2+ appends extract/reminder/ui.
  - id: yolo-storage
    name: 'file:///D:/Code/WorkBuddy/dsh-yolo/src/storage/index.ts'
  - id: yolo-memory
    name: 'file:///D:/Code/WorkBuddy/dsh-yolo/src/memory/index.ts'
  - id: yolo-extract
    name: 'file:///D:/Code/WorkBuddy/dsh-yolo/src/extract/index.ts'
  - id: yolo-reminder
    name: 'file:///D:/Code/WorkBuddy/dsh-yolo/src/reminder/index.ts'
  - id: yolo-ui
    name: 'file:///D:/Code/WorkBuddy/dsh-yolo/src/ui/index.ts'
