# YOLO development patch — portable manual boot.
#
# Entries use PACKAGE NAMES (resolved through the npm package's `exports`),
# not file:// URLs, so this file works on any machine and serves the browser
# client bundle. The subpaths (e.g. `/dist/src/storage`) are the built output,
# so run `pnpm build` before using this file directly.
#
# The all-in-one dev loop (build + clone host + browser client) is:
#   pnpm dev:web        # generates the gitignored cordis.dev.local.yml and boots it
# You can also hand this file to `dsh web --patch cordis.dev.yml` after a build.
- insert:
  - id: yolo
    name: 'dsh-plugin-yolo'
  - id: yolo-storage
    name: 'dsh-plugin-yolo/dist/src/storage'
  - id: yolo-memory
    name: 'dsh-plugin-yolo/dist/src/memory'
  - id: yolo-extract
    name: 'dsh-plugin-yolo/dist/src/extract'
  - id: yolo-reminder
    name: 'dsh-plugin-yolo/dist/src/reminder'
  - id: yolo-ui
    name: 'dsh-plugin-yolo/dist/src/ui'
